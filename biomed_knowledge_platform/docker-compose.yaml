services:
  qdrant:
    profiles: ["qdrant"]
    image: qdrant/qdrant:v1.16.3
    container_name: qdrant_service
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC API
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__STORAGE__STORAGE_PATH=/qdrant/storage
      # Added telemetry disable for bandwidth efficiency
      - QDRANT__SERVICE__TELEMETRY_DISABLED=true
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", ":> /dev/tcp/127.0.0.1/6333"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  api:
    profiles: ["app"]
    depends_on:
      - qdrant
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./configs:/service/configs:ro

volumes:
  qdrant_storage:
