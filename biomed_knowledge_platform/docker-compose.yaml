services:
  qdrant:
    profiles: ["qdrant"]
    image: qdrant/qdrant:v1.16.3
    container_name: qdrant_service
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC API
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__STORAGE__STORAGE_PATH=/qdrant/storage
      # Added telemetry disable for bandwidth efficiency
      - QDRANT__SERVICE__TELEMETRY_DISABLED=true
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", ":> /dev/tcp/127.0.0.1/6333"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  postgres:
    profiles: ["postgres"]
    build:
      context: ./postgres
    image: biomed_knowledge_platform-postgres:17.7
    container_name: postgres-db
    hostname: rdbms
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: biomed_knowledge_platform
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d biomed_knowledge_platform" ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    profiles: ["app"]
    depends_on:
      - qdrant
      - postgres
    build: .
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    ports:
      - "8000:8000"

volumes:
  qdrant_storage:
  postgres_data:
