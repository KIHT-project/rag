version: 1
disable_existing_loggers: false

filters:
  request_id:
    (): biomed_platform.common.logging.RequestIdFilter

formatters:
  app:
    format: "%(asctime)s %(levelname)s request_id=%(request_id)s %(name)s %(message)s"
  uvicorn:
    format: "%(asctime)s %(levelname)s %(name)s %(message)s"

handlers:
  console_app:
    class: logging.StreamHandler
    level: INFO
    formatter: app
    filters: [request_id]
    stream: ext://sys.stdout

  console_uvicorn:
    class: logging.StreamHandler
    level: INFO
    formatter: uvicorn
    stream: ext://sys.stdout

root:
  level: INFO
  handlers: [console_app]

loggers:
  uvicorn:
    level: INFO
    handlers: [console_uvicorn]
    propagate: false

  uvicorn.error:
    level: INFO
    handlers: [console_uvicorn]
    propagate: false

  uvicorn.access:
    level: INFO
    handlers: [console_uvicorn]
    propagate: false
