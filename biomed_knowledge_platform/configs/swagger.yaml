openapi: 3.1.0
info:
  title: Biomed Knowledge Platform API
  version: 1.0.0
  description: High-performance API for thrombosis knowledge extraction. Supports
    DOI-based ingestion, Qdrant vector retrieval, and RAG-based risk factor extraction.
servers:
- url: http://localhost:8000
  description: Root server, system endpoints and versioned API
tags:
- name: System
  description: Infrastructure and health monitoring.
- name: Ingestion
  description: Operations related to DOI processing and vector storage.
- name: Retrieval
  description: Search and RAG (Retrieval-Augmented Generation) operations.
- name: Documents
  description: Operations related to read/delete existing DOIs.
paths:
  /health:
    get:
      tags:
      - System
      summary: Health check
      operationId: healthCheck
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              description: Request id for tracing
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  status:
                    type: string
                    examples:
                    - ok
                required:
                - status
  /ready:
    get:
      tags:
      - System
      summary: Readiness check
      operationId: readinessCheck
      description: 'Readiness indicates whether the service is ready to receive traffic.
        This may check downstream dependencies and configuration presence.

        '
      responses:
        '200':
          description: Ready
          headers:
            X-Request-Id:
              description: Request id for tracing
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
              examples:
                ready:
                  value:
                    status: ready
                    checks:
                      qdrant: ok
                      llm: ok
                      rdbms: ok
        '503':
          description: Not ready
          headers:
            X-Request-Id:
              description: Request id for tracing
              schema:
                type: string
            Retry-After:
              description: Optional backoff hint in seconds
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
              examples:
                not_ready:
                  value:
                    status: not_ready
                    checks:
                      qdrant: missing_config
                      llm: ok
                      rdbms: unhealthy
  /v1/ingest/items:
    post:
      tags:
      - Ingestion
      summary: Ingest documents (abstract now, full text later), DOI only
      operationId: ingestItems
      description: 'Ingests one or more paper documents. DOI is mandatory and must
        be unique per embedding model space. Re-upload of an existing DOI is rejected.
        Processing may run asynchronously; job state is best-effort in v1.

        '
      parameters:
      - name: X-Request-Id
        in: header
        required: false
        description: Optional request id for tracing
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: false
        description: Optional idempotency key for safe retries
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestBatchRequest'
      responses:
        '202':
          description: Accepted
          headers:
            X-Request-Id:
              description: Request id for tracing
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestJobAcceptedResponse'
        '400':
          description: Validation error or unsupported model id
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Duplicate DOI not allowed
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many requests
          headers:
            X-Request-Id:
              schema:
                type: string
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/ingest/jobs/{job_id}:
    get:
      tags:
      - Ingestion
      summary: Get ingestion job status
      operationId: getIngestJobStatus
      description: 'Returns best-effort job status. In v1, job state may be lost after
        service restart.

        '
      parameters:
      - name: X-Request-Id
        in: header
        required: false
        description: Optional request id for tracing
        schema:
          type: string
      - name: job_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Job status
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestJobStatusResponse'
        '404':
          description: Job not found
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/documents/{doi}:
    patch:
      tags:
      - Documents
      summary: Patch a document by DOI
      operationId: patchDocumentByDoi
      description: 'Updates stored document metadata and, if content_text is provided,
        re-chunks and re-embeds the document under the same embedding model space.
        DOI and internal ids are immutable. If content_text is included, the server
        may process asynchronously and return 202.

        '
      parameters:
      - name: X-Request-Id
        in: header
        required: false
        description: Optional request id for tracing
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: false
        description: Optional idempotency key for safe retries
        schema:
          type: string
      - name: doi
        in: path
        required: true
        description: URL-encoded DOI (slashes must be percent-encoded)
        allowReserved: true
        schema:
          type: string
          minLength: 3
          maxLength: 512
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentPatchRequest'
      responses:
        '200':
          description: Patched document
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
        '202':
          description: Accepted for async reindexing
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentPatchAcceptedResponse'
        '400':
          description: Validation error or unsupported model id
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: DOI not found
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict, for example concurrent update
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many requests
          headers:
            X-Request-Id:
              schema:
                type: string
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - Documents
      summary: Delete a document by DOI
      operationId: deleteDocumentByDoi
      description: 'Deletes all stored chunks and metadata for the given DOI in the
        configured embedding model space.

        '
      parameters:
      - name: X-Request-Id
        in: header
        required: false
        description: Optional request id for tracing
        schema:
          type: string
      - name: doi
        in: path
        required: true
        description: URL-encoded DOI (slashes must be percent-encoded)
        allowReserved: true
        schema:
          type: string
          minLength: 3
          maxLength: 512
      responses:
        '204':
          description: Deleted
          headers:
            X-Request-Id:
              schema:
                type: string
        '404':
          description: DOI not found
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict, for example delete blocked by in-flight job
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many requests
          headers:
            X-Request-Id:
              schema:
                type: string
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
      - Retrieval
      summary: Get a document by DOI
      operationId: getDocumentByDoi
      description: Returns all stored information for a single DOI, including current
        stored text and chunk ids.
      parameters:
      - name: X-Request-Id
        in: header
        required: false
        description: Optional request id for tracing
        schema:
          type: string
      - name: doi
        in: path
        required: true
        description: URL-encoded DOI (slashes must be percent-encoded)
        allowReserved: true
        schema:
          type: string
          minLength: 3
          maxLength: 512
      responses:
        '200':
          description: Document
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
        '400':
          description: Validation error
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: DOI not found
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many requests
          headers:
            X-Request-Id:
              schema:
                type: string
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: System error
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/documents/fetch:
    post:
      tags:
      - Documents
      summary: Fetch a document by DOI or PMID
      operationId: fetchDocument
      description: Fetches document metadata and text from PubMed/PMC. If X-Ingest-Enabled
        is true (default), the fetched content is ingested immediately (abstract
        only if full text unavailable).
      parameters:
      - name: X-Request-Id
        in: header
        required: false
        description: Optional request id for tracing
        schema:
          type: string
      - name: X-Ingest-Enabled
        in: header
        required: false
        description: If true (default), ingest fetched content into the vector index
        schema:
          type: boolean
          default: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentFetchRequest'
      responses:
        '200':
          description: Document fetched
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentFetchResponse'
        '400':
          description: Validation error
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: DOI or PMID not found
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict, for example duplicate DOI on ingest
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many requests
          headers:
            X-Request-Id:
              schema:
                type: string
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: System error
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/documents/fetch/batch:
    post:
      tags:
      - Documents
      summary: Fetch documents by DOI or PMID (async)
      operationId: fetchDocumentsBatch
      description: Enqueues retrieval (and optional ingest) for multiple documents.
        If X-Ingest-Enabled is true (default), ingests fetched content into the vector
        index.
      parameters:
      - name: X-Request-Id
        in: header
        required: false
        description: Optional request id for tracing
        schema:
          type: string
      - name: X-Ingest-Enabled
        in: header
        required: false
        description: If true (default), ingest fetched content into the vector index
        schema:
          type: boolean
          default: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentFetchBatchRequest'
      responses:
        '202':
          description: Accepted
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentFetchBatchAcceptedResponse'
        '400':
          description: Validation error
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many requests
          headers:
            X-Request-Id:
              schema:
                type: string
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: System error
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/search:
    post:
      tags:
      - Retrieval
      summary: Vector search over stored chunks
      operationId: searchChunks
      description: 'Embeds the query and returns the most relevant chunks from Qdrant,
        applying metadata filters. Model ids are optional and default to rag.yaml
        configuration.

        '
      parameters:
      - name: X-Request-Id
        in: header
        required: false
        description: Optional request id for tracing
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Search hits
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          description: Validation error or unsupported model id
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many requests
          headers:
            X-Request-Id:
              schema:
                type: string
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/ask:
    post:
      tags:
      - Retrieval
      summary: Ask question with RAG
      operationId: askQuestion
      description: 'Runs retrieval (optional HyDE), LLM reranking, and structured
        risk factor extraction. Returns an answer plus retrieval-grounded citations
        (chunk ids and snippets).

        '
      parameters:
      - name: X-Request-Id
        in: header
        required: false
        description: Optional request id for tracing
        schema:
          type: string
      - name: x-hyde-enabled
        in: header
        required: false
        description: Enable HyDE hybrid retrieval when true
        schema:
          type: boolean
      - name: x-debug-enabled
        in: header
        required: false
        description: Enable debug response payload when true (default false)
        schema:
          type: boolean
          default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskRequest'
      responses:
        '200':
          description: Answer with citations
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskResponseEnvelope'
        '400':
          description: Validation error or unsupported model id
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many requests
          headers:
            X-Request-Id:
              schema:
                type: string
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/documents:
    get:
      tags:
      - Documents
      summary: List ingested DOIs
      operationId: listDois
      description: Lists all currently stored DOIs. If header X-Include-Document-Info
        is true, returns full document info per DOI.
      parameters:
      - name: X-Request-Id
        in: header
        required: false
        description: Optional request id for tracing
        schema:
          type: string
      - name: X-Include-Document-Info
        in: header
        required: false
        description: If true, include full document info per DOI in the response
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: DOI list
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/DoiListSimpleResponse'
                - $ref: '#/components/schemas/DoiListExpandedResponse'
              examples:
                simple:
                  value:
                    request_id: req_123
                    dois:
                    - 10.1000/xyz123
                    - 10.5555/abc987
                expanded:
                  value:
                    request_id: req_123
                    documents:
                    - doc_id: doc_1
                      doi: 10.1000/xyz123
                      chunk_ids:
                      - chunk_1
                      - chunk_2
                      chunk_total: 2
                      authors:
                      - A Author
                      - B Author
                      journal: Journal Name
                      year: 2024
                      source_type: pubmed_abstract
                      title: Paper title
                      content_text: Abstract text
                      updated_at: '2026-01-18T14:32:05Z'
        '429':
          description: Too many requests
          headers:
            X-Request-Id:
              schema:
                type: string
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: System error
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Optional, not enforced in v1
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      properties:
        request_id:
          type: string
          description: Request id for tracing
        error:
          type: string
          description: Machine-readable error code
          enum:
          - validation_error
          - invalid_model_id
          - duplicate_doi
          - not_found
          - too_many_requests
          - system_error
        message:
          type: string
          description: Human-readable error message
        details:
          type: object
          description: Optional structured details
          additionalProperties: true
        status_code:
          type: integer
          description: HTTP status code
          examples:
          - 400
        timestamp:
          type: string
          format: date-time
          description: UTC timestamp in ISO 8601 format
          examples:
          - '2026-01-18T14:32:05Z'
      required:
      - request_id
      - error
      - message
      - status_code
      - timestamp
    ReadinessStatus:
      type: string
      enum:
      - ready
      - not_ready
    CheckStatus:
      type: string
      enum:
      - ok
      - missing_config
      - unhealthy
      - degraded
      - error
      description: 'Status for a single readiness check. The service should pick the
        subset it uses.

        '
    ReadinessChecks:
      type: object
      additionalProperties: false
      properties:
        qdrant:
          $ref: '#/components/schemas/CheckStatus'
        llm:
          $ref: '#/components/schemas/CheckStatus'
        rdbms:
          $ref: '#/components/schemas/CheckStatus'
      required:
      - qdrant
      - llm
      - rdbms
    ReadinessResponse:
      type: object
      required:
      - status
      - checks
      properties:
        status:
          $ref: '#/components/schemas/ReadinessStatus'
        checks:
          $ref: '#/components/schemas/ReadinessChecks'
        errors:
          type: object
          additionalProperties:
            type: object
            additionalProperties: true
          description: Dependency specific failure details, present when status is
            not_ready.
    Disease:
      type: string
      enum:
      - thrombosis
      - unknown
      - cancer
      description: Disease scope for v1
    SourceType:
      type: string
      enum:
      - pubmed_abstract
      - other_abstract
      - full_text
      description: 'Source type. v1 supports abstracts; full_text reserved for future
        pipeline expansion.

        '
    IngestItem:
      type: object
      additionalProperties: false
      properties:
        doi:
          type: string
          description: DOI as provided by client, stored for end users as doi_original
          minLength: 3
          maxLength: 512
        disease:
          $ref: '#/components/schemas/Disease'
        year:
          type: integer
          minimum: 1800
          maximum: 2100
        source_type:
          $ref: '#/components/schemas/SourceType'
        title:
          type: string
          maxLength: 2000
        journal:
          type: string
          maxLength: 2000
        authors:
          type: array
          items:
            type: string
            maxLength: 512
          maxItems: 200
        content_text:
          type: string
          minLength: 1
          maxLength: 50000
          description: 'Document text. In v1 this is typically the abstract. In future
            it may contain full text.

            '
      required:
      - doi
      - disease
      - source_type
      - content_text
    DocumentPatchRequest:
      type: object
      additionalProperties: false
      description: 'Patch payload for a DOI. Provide at least one field. If content_text
        is provided, the server will re-chunk and re-embed the document.

        '
      properties:
        year:
          type: integer
          minimum: 1800
          maximum: 2100
        source_type:
          $ref: '#/components/schemas/SourceType'
        title:
          type: string
          maxLength: 2000
        journal:
          type: string
          maxLength: 2000
        authors:
          type: array
          items:
            type: string
            maxLength: 512
          maxItems: 200
        content_text:
          type: string
          minLength: 1
          maxLength: 50000
          description: Updated document text, typically abstract in v1
      anyOf:
      - required:
        - year
      - required:
        - source_type
      - required:
        - title
      - required:
        - journal
      - required:
        - authors
      - required:
        - content_text
