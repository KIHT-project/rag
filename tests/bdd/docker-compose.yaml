services:
  qdrant:
    image: qdrant/qdrant:v1.16.3
    ports:
      - "6335:6333" # the original is 6333 but is reserved by the host.
      - "6336:6334" # the original is 6334 but is reserved by the host.
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__STORAGE__STORAGE_PATH=/qdrant/storage
    volumes:
      - qdrant_test_storage:/qdrant/storage
    healthcheck:
      test: [ "CMD", "bash", "-c", ":> /dev/tcp/127.0.0.1/6333" ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:17.7
    hostname: rdbms
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: test_biomed_knowledge_platform
    ports:
      - "5433:5432"
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d test_biomed_knowledge_platform" ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_scheduler:
    image: postgres:17.7
    hostname: scheduler-rdbms
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: test_pubmed_scheduler
    ports:
      - "5434:5432"
    restart: unless-stopped
    volumes:
      - scheduler_postgres_data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d test_pubmed_scheduler" ]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:0.13.5
    ports:
      - "11435:11434" # the original is 11434 but is reserved by the host.
    volumes:
      - ollama_test_models:/root/.ollama
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  core_api:
    profiles: ["http"]
    build:
      context: ../../biomed_knowledge_platform
      dockerfile: Dockerfile
    depends_on:
      - postgres
      - qdrant
      - ollama
    environment:
      BIOMED_CONFIG_DIR: /service/configs
    ports:
      - "8000:8000"
    volumes:
      - ./config_core_http:/service/configs:ro
    restart: unless-stopped

  scheduler_api:
    profiles: ["http"]
    build:
      context: ../../scheduler_pubmed
      dockerfile: Dockerfile
    depends_on:
      - postgres_scheduler
    environment:
      PUBMED_SCHEDULER_CONFIG_DIR: /service/scheduler_pubmed/config
      PUBMED_SCHEDULER_RUN_MIGRATIONS_ON_STARTUP: "true"
    ports:
      - "9000:9000"
    volumes:
      - ./config_scheduler_http:/service/scheduler_pubmed/config:ro
    restart: unless-stopped

volumes:
  qdrant_test_storage:
  ollama_test_models:
  postgres_data:
  scheduler_postgres_data:
