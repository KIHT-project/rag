rag_api:
  base_url: http://127.0.0.1:8000
  timeout_seconds: 2000.0
  search_top_k_pool: 5
  search_top_k_context: 10
ask:
  hyde_header_name: X-HyDE-Enabled
  hyde_header_value: 'true'
ollama:
  base_url: http://192.168.2.3:11434
  model: llama3.1:8b-instruct-q4_K_M
  temperature: 0.2
  num_predict: 700
paper:
  # Medium profile: keep deterministic primary run.
  primary_seed: 42
  primary_temperature: 0.0
  # Disable robustness seeds to keep runtime around ~40 minutes.
  robustness_temperature: 0.2
  robustness_seeds: []
  # Process default query count from queries file (currently 5).
  max_queries: 5
  # Keep all three generation modes in primary run.
  modes:
    - rag_no_hyde
    - rag_hyde
    - llm_only
paths:
  queries_jsonl: evaluation_metrics/queries/queries.jsonl
  runs_dir: evaluation_metrics/runs
ragas:
  embeddings_model: sentence-transformers/all-MiniLM-L6-v2
  embeddings_device: cpu
  embeddings_local_only: true
  # One metric for medium-speed scoring.
  metrics:
    - answer_relevancy
metrics:
  k_values:
  - 5
  - 10
  - 20
audit:
  postgres_dsn: postgresql://user:password@localhost:5432/biomed_knowledge_platform
  sample_size: 12
  seed: 42
